AWSTemplateFormatVersion: '2010-09-09'
Description: One-time admin bootstrap for the Brahma Dexto demo (us-east-1).
Parameters:
  DextoPrincipalArn:
    Type: String
    Default: arn:aws:iam::138185518449:user/dexto-aws-mcp-broker
    Description: Broker IAM principal ARN from Dexto's AWS connect screen.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:(role|user)/.+$'
  EnforceMcpOnly:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Require MCP routing for direct requests except artifact and account seed uploads.
  ExternalId:
    Type: String
    NoEcho: true
    MinLength: 1
  BudgetEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  MonthlyBudgetUsd:
    Type: Number
    Default: 150
    MinValue: 1
Conditions:
  EnforceMcpOnlyEnabled: !Equals [!Ref EnforceMcpOnly, 'true']
Resources:
  DextoDemoRole:
    Type: AWS::IAM::Role
    # Legacy aws-mcp:* is required for this demo but absent from the lint catalog.
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3037]
    Properties:
      RoleName: DextoDemoRole
      MaxSessionDuration: 3600
      Tags: [{Key: project, Value: brahma-demo}]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # sts:ExternalId is not in the SetSourceIdentity request context, so each action
          # needs its own statement.
          - Effect: Allow
            Principal: {AWS: !Ref DextoPrincipalArn}
            Action: sts:AssumeRole
            Condition: {StringEquals: {'sts:ExternalId': !Ref ExternalId}}
          - Effect: Allow
            Principal: {AWS: !Ref DextoPrincipalArn}
            Action: sts:SetSourceIdentity
            Condition: {StringLike: {'sts:SourceIdentity': 'dexto-*'}}
      # EB requires broad permissions on its underlying EC2, S3, IAM and other services.
      # When enabled, the explicit Deny also gates this managed policy's direct grants through MCP.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess-AWSElasticBeanstalk
      Policies:
        - PolicyName: ProvisionAndOperate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/brahma-demo-*/*'
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt DextoDemoCfnExecRole.Arn
                Condition:
                  StringEquals: {'iam:PassedToService': cloudformation.amazonaws.com}
              - Effect: Allow
                Action: ['codebuild:StartBuild', 'codebuild:ListBuildsForProject']
                Resource:
                  - !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/accounts-api-image'
                  - !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/risk-engine-image'
              - Effect: Allow
                # CodeBuild authorizes BatchGetBuilds against the project ARN, not the build ARN.
                Action: codebuild:BatchGetBuilds
                Resource:
                  - !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/accounts-api-image'
                  - !Sub 'arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/risk-engine-image'
              - Effect: Allow
                Action: batch:RegisterJobDefinition
                Resource: !Sub 'arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/risk-engine'
              - Effect: Allow
                Action: batch:SubmitJob
                Resource:
                  - !Sub 'arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job/*'
                  - !Sub 'arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/risk-engine'
                  - !Sub 'arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-definition/risk-engine:*'
                  - !Sub 'arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job-queue/brahma-demo-queue'
              - Effect: Allow
                Action: batch:TerminateJob
                Resource: !Sub 'arn:aws:batch:${AWS::Region}:${AWS::AccountId}:job/*'
              # These Batch read/list APIs do not support resource-level permissions.
              - Effect: Allow
                Action: ['batch:DescribeJobs', 'batch:DescribeJobDefinitions', 'batch:DescribeJobQueues', 'batch:ListJobs']
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/brahma-demo-batch-job'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/brahma-demo-batch-exec'
                Condition:
                  StringEquals: {'iam:PassedToService': ecs-tasks.amazonaws.com}
              - Effect: Allow
                Action: ['logs:GetLogEvents', 'logs:FilterLogEvents', 'logs:DescribeLogStreams']
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/batch/job:*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Effect: Allow
                # The managed EKS MCP server reaches the Kubernetes API through eks:AccessKubernetesApi;
                # the cluster access entry then governs what it may do in Kubernetes.
                Action: ['eks:DescribeCluster', 'eks:AccessKubernetesApi']
                Resource: !Sub 'arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/brahma-demo'
              - Effect: Allow
                Action: ['eks:ListClusters', 'sts:GetCallerIdentity']
                Resource: '*'
              - Effect: Allow
                Action: ['ecr:DescribeImages', 'ecr:DescribeRepositories', 'ecr:ListImages']
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/brahma-demo/*'
              - Effect: Allow
                Action: ['s3:ListBucket', 's3:GetBucketLocation']
                Resource: !Sub 'arn:aws:s3:::brahma-demo-data-${AWS::AccountId}'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::brahma-demo-data-${AWS::AccountId}/*'
              # Presigned JAR and account seed PUTs come from the computer.
              # Only these two prefixes may be written, including outside MCP.
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::brahma-demo-artifacts-${AWS::AccountId}/ops-console/*'
                  - !Sub 'arn:aws:s3:::brahma-demo-data-${AWS::AccountId}/accounts/*'
              # The standard EKS Service integration creates a Classic Load Balancer.
              - Effect: Allow
                Action: elasticloadbalancing:DeleteLoadBalancer
                Resource: !Sub 'arn:aws:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/*'
                Condition:
                  StringEquals: {'aws:ResourceTag/project': brahma-demo}
              # Classic ELB discovery APIs do not support resource-level permissions.
              - Effect: Allow
                Action: ['elasticloadbalancing:DescribeLoadBalancers', 'elasticloadbalancing:DescribeTags']
                Resource: '*'
              - Effect: Allow
                Action: ['aws-mcp:*', 'eks-mcp:*']
                Resource: '*'
              # Elastic Beanstalk and CloudFormation make downstream calls with forward
              # access sessions carrying aws:ViaAWSService=true but not the MCP key.
              - !If
                - EnforceMcpOnlyEnabled
                - Effect: Deny
                  NotAction: ['s3:PutObject', 'aws-mcp:*', 'eks-mcp:*']
                  Resource: '*'
                  Condition:
                    BoolIfExists: {'aws:ViaAWSMCPService': 'false', 'aws:ViaAWSService': 'false'}
                - !Ref AWS::NoValue
              - Effect: Deny
                Action: s3:PutObject
                NotResource:
                  - !Sub 'arn:aws:s3:::brahma-demo-artifacts-${AWS::AccountId}/ops-console/*'
                  - !Sub 'arn:aws:s3:::brahma-demo-data-${AWS::AccountId}/accounts/*'
  DextoDemoCfnExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DextoDemoCfnExecRole
      Tags: [{Key: project, Value: brahma-demo}]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      # Demo-account execution role: CFN must create IAM roles, EKS and VPC resources.
      # Explicit denies prevent user credentials, account/org changes and self-editing.
      # This is a demo guardrail, not a sandbox against malicious admin templates.
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AdministratorAccess]
      Policies:
        - PolicyName: DemoGuardrails
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Deny
                Action: ['iam:CreateUser', 'iam:CreateAccessKey', 'iam:CreateLoginProfile', 'organizations:*', 'account:*']
                Resource: '*'
              - Effect: Deny
                Action:
                  - iam:CreateRole
                  - iam:Update*
                  - iam:Delete*
                  - iam:Put*
                  - iam:Attach*
                  - iam:Detach*
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:AddRoleToInstanceProfile
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/DextoDemoRole'
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/DextoDemoCfnExecRole'
  DemoBudget:
    Type: AWS::Budgets::Budget
    Properties:
      ResourceTags: [{Key: project, Value: brahma-demo}]
      Budget:
        BudgetName: brahma-demo-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
Outputs:
  DextoDemoRoleArn:
    Value: !GetAtt DextoDemoRole.Arn
  DextoDemoCfnExecRoleArn:
    Value: !GetAtt DextoDemoCfnExecRole.Arn
