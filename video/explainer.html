<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brahma demo explainer</title>
<style>
  /* Four slides on a 1920x1080 stage. Slides A to C play by themselves in 48 seconds,
     in step with the narration for shots 2a to 2c. Slide D (AWS) plays alone in 11
     seconds: open the page with #aws.
     Keys: R restart, Space pause or resume, Right and Left step, A show everything,
     1 to 4 jump to a slide fully revealed. */
  :root { --x-fg: #f2f4f7; --x-muted: #9aa5b4; --x-line: #2c3440; --x-box: #161b23;
          --x-accent: #5fc2e6; --x-accent-soft: #12303c; }
  html, body { height: 100%; margin: 0; background: #0e1116; overflow: hidden; }
  svg { position: absolute; inset: 0; width: 100vw; height: 100vh; display: none; }
  svg.current { display: block; }
  [data-step] { opacity: 0; transition: opacity .5s ease; }
  [data-step].on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { [data-step] { transition: none; } }

  .x-title { font: 600 60px "Helvetica Neue", Arial, sans-serif; fill: var(--x-fg); }
  .x-big { font: 600 64px "Helvetica Neue", Arial, sans-serif; fill: var(--x-fg); }
  .x-strong { font: 600 38px "Helvetica Neue", Arial, sans-serif; fill: var(--x-fg); }
  .x-name { font: 600 38px ui-monospace, Menlo, Consolas, monospace; fill: var(--x-fg); }
  .x-cell { font: 34px "Helvetica Neue", Arial, sans-serif; fill: var(--x-muted); }
  .x-caption { font: 40px "Helvetica Neue", Arial, sans-serif; fill: var(--x-fg); }
  .x-label { font: 500 24px ui-monospace, Menlo, Consolas, monospace; fill: var(--x-muted); letter-spacing: 2px; }
  .x-accent { fill: var(--x-accent); }
  .x-box { fill: var(--x-box); stroke: var(--x-line); stroke-width: 2; }
  .x-target { fill: var(--x-accent-soft); stroke: var(--x-accent); stroke-width: 2; }
  .x-account { fill: none; stroke: var(--x-muted); stroke-width: 2; stroke-dasharray: 10 8; }
  .x-missing { fill: none; stroke: var(--x-accent); stroke-width: 2; stroke-dasharray: 8 6; }
  .x-rule { stroke: var(--x-line); stroke-width: 2; }
  .x-arrow { stroke: var(--x-muted); stroke-width: 3; fill: none; }
  .x-head { fill: var(--x-muted); }

</style>
</head>
<body>
<svg data-slide="A" viewBox="0 0 1920 1080" role="img"><defs><marker id="x-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="x-head"/></marker></defs><text x="960" y="150" class="x-title" text-anchor="middle" data-step="1">A typical product has three parts</text><g data-step="2"><rect x="1280" y="330" width="520" height="240" rx="12" class="x-target"/><text x="1540" y="440" class="x-big" text-anchor="middle">WEB APP</text><text x="1540" y="510" class="x-cell" text-anchor="middle">what the team uses</text></g><g data-step="3"><rect x="700" y="330" width="520" height="240" rx="12" class="x-target"/><text x="960" y="440" class="x-big" text-anchor="middle">API</text><text x="960" y="510" class="x-cell" text-anchor="middle">behind it</text><line x1="1220" y1="450" x2="1272" y2="450" class="x-arrow" marker-end="url(#x-ah)"/></g><g data-step="4"><rect x="120" y="330" width="520" height="240" rx="12" class="x-target"/><text x="380" y="440" class="x-big" text-anchor="middle">ML JOB</text><text x="380" y="510" class="x-cell" text-anchor="middle">feeds it</text><line x1="640" y1="450" x2="692" y2="450" class="x-arrow" marker-end="url(#x-ah)"/></g><g data-step="5"><text x="960" y="730" class="x-big" text-anchor="middle">Three repositories. Three ways to deploy.</text><text x="960" y="820" class="x-caption" text-anchor="middle">Usually built by different people.</text></g></svg>
<svg data-slide="B" viewBox="0 0 1920 1080" role="img"><defs><marker id="x-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="x-head"/></marker></defs><text x="960" y="150" class="x-title" text-anchor="middle" data-step="1">Here is ours</text><g data-step="2"><rect x="1280" y="230" width="520" height="400" rx="12" class="x-box"/><text x="1320" y="300" class="x-label x-accent">WEB APP</text><text x="1320" y="366" class="x-strong">Internal console where</text><text x="1320" y="416" class="x-strong">the operations team looks</text><text x="1320" y="466" class="x-strong">up customer accounts</text><text x="1320" y="540" class="x-cell">Java, shipped as a JAR</text><text x="1320" y="596" class="x-label">REPO OPS-CONSOLE</text><line x1="1540" y1="630" x2="1540" y2="702" class="x-arrow" marker-end="url(#x-ah)"/><text x="1564" y="678" class="x-label">RUNS ON</text><rect x="1280" y="710" width="520" height="110" rx="12" class="x-target"/><text x="1540" y="778" class="x-strong" text-anchor="middle">Elastic Beanstalk</text></g><g data-step="3"><rect x="700" y="230" width="520" height="400" rx="12" class="x-box"/><text x="740" y="300" class="x-label x-accent">API</text><text x="740" y="366" class="x-strong">Serves those accounts</text><text x="740" y="416" class="x-strong">to the console</text><text x="740" y="540" class="x-cell">Python, in a container</text><text x="740" y="596" class="x-label">REPO ACCOUNTS-API</text><line x1="960" y1="630" x2="960" y2="702" class="x-arrow" marker-end="url(#x-ah)"/><text x="984" y="678" class="x-label">RUNS ON</text><rect x="700" y="710" width="520" height="110" rx="12" class="x-target"/><text x="960" y="778" class="x-strong" text-anchor="middle">Kubernetes (Amazon EKS)</text></g><g data-step="4"><rect x="120" y="230" width="520" height="400" rx="12" class="x-box"/><text x="160" y="300" class="x-label x-accent">ML JOB</text><text x="160" y="366" class="x-strong">Scores every account</text><text x="160" y="416" class="x-strong">for risk</text><text x="160" y="540" class="x-cell">Python, run as a batch job</text><text x="160" y="596" class="x-label">REPO RISK-ENGINE</text><line x1="380" y1="630" x2="380" y2="702" class="x-arrow" marker-end="url(#x-ah)"/><text x="404" y="678" class="x-label">RUNS ON</text><rect x="120" y="710" width="520" height="110" rx="12" class="x-target"/><text x="380" y="778" class="x-strong" text-anchor="middle">AWS Batch</text></g></svg>
<svg data-slide="C" viewBox="0 0 1920 1080" role="img"><defs><marker id="x-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="x-head"/></marker></defs><text x="960" y="150" class="x-title" text-anchor="middle" data-step="1">One change: show a risk score on every account</text><g data-step="2"><rect x="120" y="300" width="520" height="220" rx="12" class="x-target"/><text x="380" y="390" class="x-big" text-anchor="middle">ML JOB</text><text x="380" y="465" class="x-strong x-accent" text-anchor="middle">computes it</text></g><g data-step="3"><rect x="700" y="300" width="520" height="220" rx="12" class="x-target"/><text x="960" y="390" class="x-big" text-anchor="middle">API</text><text x="960" y="465" class="x-strong x-accent" text-anchor="middle">returns it</text><line x1="640" y1="410" x2="692" y2="410" class="x-arrow" marker-end="url(#x-ah)"/></g><g data-step="4"><rect x="1280" y="300" width="520" height="220" rx="12" class="x-target"/><text x="1540" y="390" class="x-big" text-anchor="middle">WEB APP</text><text x="1540" y="465" class="x-strong x-accent" text-anchor="middle">displays it</text><line x1="1220" y1="410" x2="1272" y2="410" class="x-arrow" marker-end="url(#x-ah)"/></g><g data-step="5"><text x="960" y="690" class="x-big" text-anchor="middle">Three repositories. Three deployments.</text><text x="960" y="790" class="x-caption" text-anchor="middle">Usually days of coordination between teams.</text></g></svg>
<svg data-slide="D" viewBox="0 0 1920 1080" role="img"><defs><marker id="x-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="x-head"/></marker></defs><text x="960" y="150" class="x-title" text-anchor="middle" data-step="1">Dexto works inside your AWS account</text><g data-step="1"><rect x="120" y="380" width="340" height="200" rx="12" class="x-box"/><text x="290" y="495" class="x-big" text-anchor="middle">Dexto</text><rect x="700" y="240" width="1100" height="480" rx="16" class="x-account"/><text x="740" y="300" class="x-label">YOUR AWS ACCOUNT</text></g><g data-step="2"><line x1="460" y1="480" x2="752" y2="480" class="x-arrow" marker-end="url(#x-ah)"/><text x="606" y="450" class="x-label" text-anchor="middle">USES THE ROLE</text><text x="606" y="530" class="x-label" text-anchor="middle">NO ACCESS KEYS</text><rect x="760" y="380" width="360" height="200" rx="12" class="x-target"/><text x="940" y="465" class="x-strong" text-anchor="middle">A role you create</text><text x="940" y="520" class="x-cell" text-anchor="middle">sets what is allowed</text></g><g data-step="3"><line x1="1120" y1="480" x2="1272" y2="380" class="x-arrow" marker-end="url(#x-ah)"/><rect x="1280" y="340" width="460" height="80" rx="10" class="x-box"/><text x="1510" y="392" class="x-strong" text-anchor="middle">AWS Batch</text><line x1="1120" y1="480" x2="1272" y2="490" class="x-arrow" marker-end="url(#x-ah)"/><rect x="1280" y="450" width="460" height="80" rx="10" class="x-box"/><text x="1510" y="502" class="x-strong" text-anchor="middle">Amazon EKS</text><line x1="1120" y1="480" x2="1272" y2="600" class="x-arrow" marker-end="url(#x-ah)"/><rect x="1280" y="560" width="460" height="80" rx="10" class="x-box"/><text x="1510" y="612" class="x-strong" text-anchor="middle">Elastic Beanstalk</text></g><text x="960" y="850" class="x-caption" text-anchor="middle" data-step="4">Builds and deploys run in your account, within the limits of that role.</text></svg>
<script>
  // Each beat: seconds from the start, the slide, and how many steps of it are visible.
  // Tuned to the narration; change the numbers here if the voice track runs differently.
  const decks = {
    main: [
      [0.3, "A", 1], [3.5, "A", 2], [5.5, "A", 3], [7.0, "A", 4], [9.5, "A", 5],
      [14.0, "B", 1], [15.5, "B", 2], [23.5, "B", 3], [28.5, "B", 4],
      [34.0, "C", 1], [38.0, "C", 2], [40.0, "C", 3], [42.0, "C", 4], [44.0, "C", 5],
    ],
    aws: [[0.3, "D", 1], [2.5, "D", 2], [6.0, "D", 3], [8.0, "D", 4]],
  };
  const deck = location.hash === "#aws" ? decks.aws : decks.main;
  const slides = Object.fromEntries([...document.querySelectorAll("svg")].map((el) => [el.dataset.slide, el]));
  let timers = [];
  let index = -1;
  let paused = false;

  function show(slide, upTo) {
    for (const [name, el] of Object.entries(slides)) el.classList.toggle("current", name === slide);
    for (const el of slides[slide].querySelectorAll("[data-step]")) {
      el.classList.toggle("on", Number(el.dataset.step) <= upTo);
    }
  }
  function go(to) {
    index = Math.max(0, Math.min(deck.length - 1, to));
    show(deck[index][1], deck[index][2]);
  }
  function clear() { timers.forEach(clearTimeout); timers = []; }
  function play() {
    clear();
    paused = false;
    show(deck[0][1], 0);
    deck.forEach(([at], i) => timers.push(setTimeout(() => go(i), at * 1000)));
  }
  addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();
    if (key === "r") play();
    else if (key === " ") { paused = !paused; if (paused) clear(); else play(); }
    else if (key === "arrowright") { clear(); go(index + 1); }
    else if (key === "arrowleft") { clear(); go(index - 1); }
    else if (key === "a") { clear(); show(deck[Math.max(index, 0)][1], 99); }
    else if (/^[1-4]$/.test(key)) { clear(); show("ABCD"[Number(key) - 1], 99); }
  });
  if (location.hash.startsWith("#slide")) show(location.hash.slice(6).toUpperCase(), 99);
  else play();
</script>
</body>
</html>
